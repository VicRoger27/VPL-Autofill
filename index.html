<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vopple Public License (VPL) v1.1.2 Generator</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f172a'/><rect x='30' y='18' width='50' height='64' rx='6' fill='%231e293b' stroke='%2311FFAA' stroke-width='5'/><path d='M20 24 C20 20.7 22.7 18 26 18 H32 V82 H26 C22.7 82 20 79.3 20 76 Z' fill='%2311FFAA'/><rect x='34' y='76' width='44' height='6' fill='%2394a3b8'/><path d='M44 34 H68 M44 44 H68 M44 54 H60' stroke='%2311FFAA' stroke-width='4' stroke-linecap='round'/></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #11FFAA;
      --accent-hover: #00e699;
      --accent-text: #0f172a;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
    }

    @media (max-width: 868px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: -0.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(17, 255, 170, 0.3);
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    textarea {
      width: 100%;
      height: 680px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      padding: 1.25rem;
      resize: vertical;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="24" fill="#0f172a"/>
          <rect x="30" y="18" width="50" height="64" rx="6" fill="#1e293b" stroke="#11FFAA" stroke-width="5"/>
          <path d="M20 24 C20 20.7 22.7 18 26 18 H32 V82 H26 C22.7 82 20 79.3 20 76 Z" fill="#11FFAA"/>
          <rect x="34" y="76" width="44" height="6" fill="#94a3b8"/>
          <path d="M44 34 H68 M44 44 H68 M44 54 H60" stroke="#11FFAA" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>📖 VPL Generator</h1>
          <p class="subtitle">v1.1.2 Source-Available License Builder</p>
        </div>
      </div>

      <div class="form-group">
        <label for="year">Copyright Year</label>
        <input type="text" id="year" value="2026">
      </div>

      <div class="form-group">
        <label for="holder">Copyright Holder / Author</label>
        <input type="text" id="holder" value="VicRodger27">
      </div>

      <div class="form-group">
        <label for="projectName">Project Name</label>
        <input type="text" id="projectName" value="My Awesome Project">
      </div>

      <div class="form-group">
        <label for="projectUrl">Repository / Source Link</label>
        <input type="text" id="projectUrl" value="https://github.com/VicRodger27/my-project">
      </div>
    </div>

    <div class="card">
      <div class="header-actions">
        <h2>📄 Generated VPL v1.1 License</h2>
        <button id="copyBtn">📋 Copy License Text</button>
      </div>
      <textarea id="licenseOutput" readonly></textarea>
    </div>
  </div>

  <script>

*Safe Harbor Exemption:* Ephemeral, non-production local execution strictly

    const yearInput = document.getElementById('year');
    const holderInput = document.getElementById('holder');
    const projectNameInput = document.getElementById('projectName');
    const projectUrlInput = document.getElementById('projectUrl');
    const licenseOutput = document.getElementById('licenseOutput');
    const copyBtn = document.getElementById('copyBtn');

    function updateLicense() {
      const year = yearInput.value || '[YEAR]';
      const holder = holderInput.value || '[COPYRIGHT HOLDER]';
      const projectName = projectNameInput.value || '[PROJECT NAME]';
      const projectUrl = projectUrlInput.value || '[PROJECT URL]';

      let text = licenseTemplate
        .replace(/{YEAR}/g, year)
        .replace(/{HOLDER}/g, holder)
        .replace(/{PROJECT_NAME}/g, projectName)
        .replace(/{PROJECT_URL}/g, projectUrl);

      licenseOutput.value = text;
    }

    [yearInput, holderInput, projectNameInput, projectUrlInput].forEach(input => {
      input.addEventListener('input', updateLicense);
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(licenseOutput.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied!';
        copyBtn.style.background = 'var(--success)';
        copyBtn.style.color = '#ffffff';
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.background = 'var(--accent)';
          copyBtn.style.color = 'var(--accent-text)';
        }, 2000);
      } catch (err) {
        alert('Failed to copy text. Please select all and copy manually.');
      }
    });

    // Initial render
    updateLicense();
  </script>
</body>
</html>
